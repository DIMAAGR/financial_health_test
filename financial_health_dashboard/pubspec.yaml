name: financial_health_dashboard
description: "Mini-app Flutter do desafio Painel de Saúde Financeira."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  go_router: ^17.2.1
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  dartz: ^0.10.1
  connectivity_plus: ^7.1.1
  freezed_annotation: ^3.1.0
  financial_health_design_system:
    path: ../packages/financial_health_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5

flutter:

  uses-material-design: true

